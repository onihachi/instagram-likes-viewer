<style>
:root{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#243c31;background:#f2f0e7}*{box-sizing:border-box}body{margin:0}header,main{max-width:1180px;margin:auto;padding:28px}header{display:flex;gap:28px;justify-content:space-between;align-items:center;border-bottom:1px solid #ccd3c8}header strong{letter-spacing:.06em}button{cursor:pointer;font:inherit;padding:10px 20px;border:1px solid #315c50;background:#315c50;color:white;border-radius:10px}button:focus-visible,a:focus-visible{outline:3px solid #bc7245;outline-offset:3px}.eyebrow{color:#668173;font-size:12px;letter-spacing:.12em;font-weight:700}h1{font-size:clamp(26px,4vw,42px);line-height:1.3;letter-spacing:-.035em;font-weight:650;margin:12px 0}p{color:#617468;max-width:780px}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:12px 0 26px}.badge{display:inline-block;padding:5px 9px;background:#e2e7d9;color:#53735b;border-radius:5px;font-size:12px}.scroller{height:65vh;overflow:auto;scrollbar-gutter:stable;border:1px solid #ccd3c8;border-radius:16px;padding:20px;background:#faf9f3;min-height:320px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.grid a{display:block;color:inherit;text-decoration:none}.grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#e1e6db}.card-text{display:flex;justify-content:space-between;gap:6px;font-size:12px;margin:5px 2px;color:#637566}.older{display:block;margin:25px auto 10px}.note{font-size:12px;margin:18px 0 55px}@media(max-width:700px){header,main{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.intro{display:block}h1{font-size:29px}}
